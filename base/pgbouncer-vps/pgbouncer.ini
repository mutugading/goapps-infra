; PgBouncer config template for the VPS PostgreSQL.
; The host in [databases] is a placeholder; each overlay replaces it via its
; own configMapGenerator (behavior: replace) with the real VPS IP.
[databases]
iam_db = host=VPS_HOST port=5432 dbname=iam_db pool_size=15 max_db_connections=15
finance_db = host=VPS_HOST port=5432 dbname=finance_db pool_size=60 max_db_connections=60
ppc_db = host=VPS_HOST port=5432 dbname=ppc_db pool_size=10 max_db_connections=10
; Payroll: DB `payroll`, role payroll_app only (the DB name in the URL is the pgbouncer key). Low traffic, internal HR use.
payroll = host=VPS_HOST port=5432 dbname=payroll pool_size=6 max_db_connections=6

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
max_prepared_statements = 200
server_tls_sslmode = require
client_tls_sslmode = disable
ignore_startup_parameters = extra_float_digits
server_reset_query = DISCARD ALL
log_connections = 1
log_disconnections = 1
stats_period = 60
admin_users = monitor
stats_users = monitor
