# ============================================================================
# Legacy PostgreSQL Alert Rules Cleanup - Auto-provisioned by Grafana Sidecar
#
# The in-cluster PostgreSQL / PgBouncer / backup CronJobs were removed
# (Postgres now runs on the VPS, see postgres-vps-alerts / docs/runbooks/
# postgres-vps-monitoring.md). This ConfigMap previously defined their alert
# rules; it now carries `deleteRules` entries only, so Grafana removes the
# previously provisioned rules from its database (same approach as
# grafana-alertrules-configmap.yaml). Once both environments have picked this
# up (check Alerting > Alert rules in Grafana), this file can be deleted
# entirely along with its kustomization entry.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-alerts
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  postgres-alerts.yaml: |
    apiVersion: 1
    deleteRules:
      - orgId: 1
        uid: postgres-down
      - orgId: 1
        uid: postgres-high-connections
      - orgId: 1
        uid: postgres-long-queries
      - orgId: 1
        uid: postgres-deadlocks
      - orgId: 1
        uid: postgres-deadlocks-ppc
      - orgId: 1
        uid: pgbouncer-down
      - orgId: 1
        uid: backup-failed
      - orgId: 1
        uid: postgres-backup-failed
