apiVersion: v1
kind: Service
metadata:
  name: vps-node
  namespace: monitoring
  labels:
    app: vps-node
    goapps/vps-monitoring: "true"
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: v1
kind: Endpoints
metadata:
  name: vps-node
  namespace: monitoring
  labels:
    app: vps-node
subsets:
  - addresses:
      - ip: 192.0.2.1   # placeholder, set per env in overlays/<env>/vps-postgres
    ports:
      - name: metrics
        port: 9100
        protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vps-node
  namespace: monitoring
  labels:
    app: vps-node
spec:
  namespaceSelector:
    matchNames: [monitoring]
  selector:
    matchLabels:
      app: vps-node
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 20s
      relabelings:
        - action: replace
          targetLabel: job
          replacement: vps-node
        - action: replace
          targetLabel: env
          replacement: CHANGE_ME      # set per env in overlays
        - action: replace
          targetLabel: instance
          replacement: CHANGE_ME      # set per env in overlays
---
