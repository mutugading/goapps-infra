# Secrets Template for GoApps
# IMPORTANT: Do NOT commit actual secret values to Git!
# Use this template to create secrets manually or via CI/CD
---
# MinIO Secret
# kubectl create secret generic minio-secret -n minio \
#   --from-literal=MINIO_ROOT_USER=admin \
#   --from-literal=MINIO_ROOT_PASSWORD='<strong-password>'
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: minio
type: Opaque
stringData:
  MINIO_ROOT_USER: admin
  MINIO_ROOT_PASSWORD: REPLACE_ME
---
# RabbitMQ Secret
# kubectl create secret generic rabbitmq-secret -n database \
#   --from-literal=RABBITMQ_USER=goapps \
#   --from-literal=RABBITMQ_PASSWORD='<strong-password>'
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: database
type: Opaque
stringData:
  RABBITMQ_USER: goapps
  RABBITMQ_PASSWORD: REPLACE_ME
---
# Oracle Credentials (Multiple Schemas)
# kubectl create secret generic oracle-credentials -n go-apps \
#   --from-literal=ORACLE_HOST='<oracle-ip>' \
#   --from-literal=ORACLE_PORT='1521' \
#   --from-literal=ORACLE_SERVICE='ORCLPDB1' \
#   --from-literal=ORACLE_MGTHRIS_USER='<user>' \
#   --from-literal=ORACLE_MGTHRIS_PASSWORD='<password>' \
#   --from-literal=ORACLE_MGTAPPS_USER='<user>' \
#   --from-literal=ORACLE_MGTAPPS_PASSWORD='<password>' \
#   --from-literal=ORACLE_MGTDAT_USER='<user>' \
#   --from-literal=ORACLE_MGTDAT_PASSWORD='<password>'
apiVersion: v1
kind: Secret
metadata:
  name: oracle-credentials
  namespace: go-apps
type: Opaque
stringData:
  # Oracle connection
  ORACLE_HOST: REPLACE_ME
  ORACLE_PORT: "1521"
  ORACLE_SERVICE: ORCLPDB1
  # Schema: mgthris
  ORACLE_MGTHRIS_USER: mgthris
  ORACLE_MGTHRIS_PASSWORD: REPLACE_ME
  # Schema: mgtapps
  ORACLE_MGTAPPS_USER: mgtapps
  ORACLE_MGTAPPS_PASSWORD: REPLACE_ME
  # Schema: mgtdat
  ORACLE_MGTDAT_USER: mgtdat
  ORACLE_MGTDAT_PASSWORD: REPLACE_ME
---
# S3/Backblaze Cloud Credentials (for PostgreSQL backup)
# kubectl create secret generic s3-cloud-credentials -n database \
#   --from-literal=S3_ENDPOINT='s3.us-west-002.backblazeb2.com' \
#   --from-literal=S3_BUCKET='your-bucket' \
#   --from-literal=AWS_ACCESS_KEY_ID='<key>' \
#   --from-literal=AWS_SECRET_ACCESS_KEY='<secret>'
apiVersion: v1
kind: Secret
metadata:
  name: s3-cloud-credentials
  namespace: database
type: Opaque
stringData:
  S3_ENDPOINT: REPLACE_ME
  S3_BUCKET: REPLACE_ME
  AWS_ACCESS_KEY_ID: REPLACE_ME
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
---
# Grafana Admin Secret
# kubectl create secret generic grafana-admin-secret -n monitoring \
#   --from-literal=admin-user=admin \
#   --from-literal=admin-password='<strong-password>'
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: REPLACE_ME
---
# Grafana SMTP Secret (for email alerts)
# kubectl create secret generic grafana-smtp-secret -n monitoring \
#   --from-literal=password='<smtp-password>'
apiVersion: v1
kind: Secret
metadata:
  name: grafana-smtp-secret
  namespace: monitoring
type: Opaque
stringData:
  password: REPLACE_ME
---
# Shared Auth Secret (JWT secrets shared between IAM + all services)
# kubectl create secret generic goapps-auth-secret -n go-apps \
#   --from-literal=JWT_ACCESS_SECRET='<strong-random-secret-256bit>' \
#   --from-literal=JWT_REFRESH_SECRET='<strong-random-secret-256bit>'
apiVersion: v1
kind: Secret
metadata:
  name: goapps-auth-secret
  namespace: go-apps
type: Opaque
stringData:
  JWT_ACCESS_SECRET: REPLACE_ME
  JWT_REFRESH_SECRET: REPLACE_ME
---
# SMTP Secret (for IAM email: OTP, 2FA notifications)
# kubectl create secret generic smtp-secret -n go-apps \
#   --from-literal=SMTP_HOST='mailpit.go-apps.svc.cluster.local' \
#   --from-literal=SMTP_PORT='1025' \
#   --from-literal=SMTP_USER='' \
#   --from-literal=SMTP_PASSWORD=''
apiVersion: v1
kind: Secret
metadata:
  name: smtp-secret
  namespace: go-apps
type: Opaque
stringData:
  SMTP_HOST: REPLACE_ME
  SMTP_PORT: "1025"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
---
# IAM Seed Secret (custom admin credentials for staging/production)
# This secret is OPTIONAL — if not created, the seeder auto-generates
# a random password and prints it to the job logs.
# kubectl create secret generic iam-seed-secret -n goapps-staging \
#   --from-literal=SEED_ADMIN_USERNAME='admin' \
#   --from-literal=SEED_ADMIN_EMAIL='admin@yourdomain.com' \
#   --from-literal=SEED_ADMIN_PASSWORD='<strong-password>'
apiVersion: v1
kind: Secret
metadata:
  name: iam-seed-secret
  namespace: goapps-staging
type: Opaque
stringData:
  SEED_ADMIN_USERNAME: admin
  SEED_ADMIN_EMAIL: REPLACE_ME
  SEED_ADMIN_PASSWORD: REPLACE_ME
---
# Container Registry Pull Secret
# kubectl create secret docker-registry ghcr-secret -n go-apps \
#   --docker-server=ghcr.io \
#   --docker-username='<github-username>' \
#   --docker-password='<github-token>'
---
# Internal Service-to-Service Token (shared between IAM + finance-worker)
# Trusted backend services send this in `x-internal-token` gRPC metadata so IAM
# accepts cross-service calls (e.g. finance-worker → CreateNotification) without
# requiring an end-user JWT.
#
# Use a DIFFERENT token per environment.
#
# Staging:
#   TOKEN="$(openssl rand -hex 32)"
#   kubectl create secret generic goapps-internal-token -n goapps-staging \
#     --from-literal=INTERNAL_SERVICE_TOKEN="$TOKEN"
#
# Production (use a different token!):
#   TOKEN="$(openssl rand -hex 32)"
#   kubectl create secret generic goapps-internal-token -n goapps-production \
#     --from-literal=INTERNAL_SERVICE_TOKEN="$TOKEN"
#
# Rotation:
#   kubectl create secret generic goapps-internal-token -n <ns> \
#     --from-literal=INTERNAL_SERVICE_TOKEN="$NEW_TOKEN" \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl rollout restart deployment/iam-service deployment/finance-worker -n <ns>
apiVersion: v1
kind: Secret
metadata:
  name: goapps-internal-token
  namespace: goapps-staging   # also create in goapps-production with different value
type: Opaque
stringData:
  INTERNAL_SERVICE_TOKEN: REPLACE_ME
---
# PPC Internal Service-to-Service Token (used by ppc-service)
# PPC sends this in `x-internal-token` gRPC metadata when reading finance cost
# masters (CostMasterLookupService) and calling IAM notifications. It is fed to
# the container as PPC_INTERNAL_TOKEN (and reused as PPC_JWT_SERVICE_SECRET).
#
# ⚠️ VALUE MUST EQUAL the `goapps-internal-token` INTERNAL_SERVICE_TOKEN in the
#    SAME namespace — finance/IAM validate the incoming token against their own
#    goapps-internal-token, so a mismatched value will make every PPC→finance /
#    PPC→IAM internal call fail (PPC currently degrades gracefully / allows).
#    Use a DIFFERENT value per environment, but keep it identical to
#    goapps-internal-token within each environment.
#
# See STATE OWED-2: finance auth_interceptor reads `x-service-secret` while PPC
# sends `x-internal-token`, and finance does not yet serve CostMasterLookup/
# Machine RPCs — a finance-side task must align the header + add handlers before
# PPC master validation is live. This secret only handles the shared value.
#
# Staging:
#   TOKEN="$(kubectl get secret goapps-internal-token -n goapps-staging \
#     -o jsonpath='{.data.INTERNAL_SERVICE_TOKEN}' | base64 -d)"
#   kubectl create secret generic ppc-internal-token -n goapps-staging \
#     --from-literal=PPC_INTERNAL_TOKEN="$TOKEN"
#
# Production (mirror goapps-internal-token's production value):
#   TOKEN="$(kubectl get secret goapps-internal-token -n goapps-production \
#     -o jsonpath='{.data.INTERNAL_SERVICE_TOKEN}' | base64 -d)"
#   kubectl create secret generic ppc-internal-token -n goapps-production \
#     --from-literal=PPC_INTERNAL_TOKEN="$TOKEN"
apiVersion: v1
kind: Secret
metadata:
  name: ppc-internal-token
  namespace: goapps-staging   # also create in goapps-production with the prod value
type: Opaque
stringData:
  PPC_INTERNAL_TOKEN: REPLACE_ME
---
# Chat Encryption Secret (AES-256-GCM master key for message encryption)
# Generate: openssl rand -hex 32
# MUST be the same across all IAM replicas — stored in DB as encrypted keys.
# Rotating this key requires re-encrypting all conversation keys.
#
# Staging:
#   KEY="$(openssl rand -hex 32)"
#   kubectl create secret generic goapps-chat-secret -n goapps-staging \
#     --from-literal=CHAT_MASTER_KEY="$KEY"
#
# Production (use a different key!):
#   KEY="$(openssl rand -hex 32)"
#   kubectl create secret generic goapps-chat-secret -n goapps-production \
#     --from-literal=CHAT_MASTER_KEY="$KEY"
apiVersion: v1
kind: Secret
metadata:
  name: goapps-chat-secret
  namespace: goapps-staging
type: Opaque
stringData:
  CHAT_MASTER_KEY: REPLACE_ME
