# Local secrets from gitignored env files (*.local.env). Copy each
# *.local.env.example -> *.local.env and fill in. Names/keys derived from what
# the deployments actually read (NOT secrets-template.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: goapps-local
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: finance-db-secret
    envs:
      - finance-db-secret.local.env
  - name: iam-db-secret
    envs:
      - iam-db-secret.local.env
  - name: ppc-db-secret
    envs:
      - ppc-db-secret.local.env
  - name: rabbitmq-secret
    envs:
      - rabbitmq-secret.local.env
  - name: minio-secret
    envs:
      - minio-secret.local.env
  - name: goapps-auth-secret
    envs:
      - goapps-auth-secret.local.env
  - name: goapps-internal-token
    envs:
      - goapps-internal-token.local.env
  - name: ppc-internal-token
    envs:
      - ppc-internal-token.local.env
  - name: oracle-credentials
    envs:
      - oracle-credentials.local.env
  - name: smtp-secret
    envs:
      - smtp-secret.local.env
  - name: iam-seed-secret
    envs:
      - iam-seed-secret.local.env
  - name: goapps-chat-secret
    envs:
      - goapps-chat-secret.local.env
