# NOT applied by GitOps -- deliberately absent from kustomization.yaml.
# kind: Job + ttlSecondsAfterFinished + ArgoCD prune/selfHeal = re-run loop,
# and `mc ilm rule add` appends a duplicate rule on every run.
# Apply by hand once per cluster, then delete the Job. See kustomization.yaml.

apiVersion: batch/v1
kind: Job
metadata:
  name: minio-ilm-setup
  namespace: database
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          image: quay.io/minio/mc:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              mc alias set minio https://minio.minio:9000 $MINIO_USER $MINIO_PASS --api S3v4 --insecure
              mc ilm rule add --expire-days 7 minio/postgres-backups --insecure
              echo "ILM rules postgres-backups:"
              mc ilm rule ls minio/postgres-backups --insecure
          env:
            - name: MINIO_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_PASS
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
