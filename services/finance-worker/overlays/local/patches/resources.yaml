# Local: small footprint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-worker
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: finance-worker
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
