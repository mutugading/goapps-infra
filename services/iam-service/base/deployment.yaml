# IAM Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam-service
  labels:
    app: iam-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0       # Never kill old pod before new one is ready
  selector:
    matchLabels:
      app: iam-service
  template:
    metadata:
      labels:
        app: iam-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: iam-service
          image: ghcr.io/mutugading/iam-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50052
              name: grpc
            - containerPort: 8081
              name: http          # HTTP gateway + /metrics
          env:
            - name: APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Database config - matches Go app config.go bindings
            - name: DATABASE_HOST
              value: "pgbouncer-vps.database.svc.cluster.local"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: "iam_db"
            - name: DATABASE_SSLMODE
              value: "disable"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: iam-db-secret
                  key: APP_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iam-db-secret
                  key: APP_PASSWORD
            # JWT (shared secrets for SSO token signing/validation)
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: goapps-auth-secret
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: goapps-auth-secret
                  key: JWT_REFRESH_SECRET
            # SMTP (email for OTP, 2FA notifications)
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: SMTP_PASSWORD
            - name: SMTP_FROM_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: SMTP_FROM_ADDRESS
            - name: SMTP_USE_TLS
              value: "true"               # port 465 SMTPS -- implicit TLS required
            - name: SMTP_SKIP_VERIFY
              value: "true"               # mail.mutugading.com uses self-signed cert
            - name: SMTP_FROM_NAME
              value: "GoApps"
            # CORS (comma-separated origins for SSO multi-app)
            - name: CORS_ALLOWED_ORIGINS
              value: "https://app.goapps.local"
            # Redis config
            - name: REDIS_HOST
              value: "redis.database.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            # Tracing
            - name: TRACING_ENABLED
              value: "true"
            - name: JAEGER_ENDPOINT
              value: "jaeger-collector.observability.svc.cluster.local:4317"
            # Storage (MinIO) - shared bucket, scoped by base_path per service
            - name: STORAGE_ENDPOINT
              value: "minio.minio.svc.cluster.local:9000"
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
            - name: STORAGE_BUCKET
              value: "goapps-staging"    # overridden per environment via kustomize
            - name: STORAGE_BASE_PATH
              value: "iam"
            - name: STORAGE_USE_SSL
              value: "true"
            - name: STORAGE_INSECURE_SKIP_VERIFY
              value: "true"              # self-signed certs in cluster
            - name: STORAGE_PUBLIC_URL
              value: ""                  # overridden per environment via kustomize
            # Internal service-to-service token — accepted in `x-internal-token`
            # gRPC metadata as a JWT bypass for trusted backend callers
            # (e.g. finance-worker emitting EXPORT_READY notifications).
            # Must match finance-worker's INTERNAL_SERVICE_TOKEN.
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: goapps-internal-token
                  key: INTERNAL_SERVICE_TOKEN
            # Chat encryption master key (AES-256-GCM).
            - name: CHAT_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: goapps-chat-secret
                  key: CHAT_MASTER_KEY
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 18    # 10 + (5*18) = 100s max startup time (IAM needs more: JWT, SMTP, MinIO)
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 5
            failureThreshold: 3
