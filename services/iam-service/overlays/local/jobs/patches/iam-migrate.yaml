apiVersion: batch/v1
kind: Job
metadata:
  name: iam-migrate
spec:
  template:
    spec:
      imagePullSecrets: null  # no ghcr-secret locally
      containers:
        - name: iam-migrate
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: iam-db-secret
                  key: OWNER_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iam-db-secret
                  key: OWNER_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@postgres-v2.database.svc.cluster.local:5432/iam_db?sslmode=disable&x-migrations-table=schema_migrations_iam&options=-c%20lock_timeout%3D10s%20-c%20statement_timeout%3D0"
