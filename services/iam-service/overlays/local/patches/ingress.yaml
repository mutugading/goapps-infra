# Local (full rules incl. paths: Ingress rules is a list without merge key, so a host-only patch drops base paths): plain HTTP on api.goapps.localhost (no TLS).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iam-service
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls: null
  rules:
    - host: api.goapps.localhost
      http:
        paths:
          - path: /api/v1/iam
            pathType: Prefix
            backend:
              service:
                name: iam-service
                port:
                  number: 8081
