# Local: small singleton.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-cost-orchestrator
spec:
  template:
    spec:
      containers:
        - name: finance-cost-orchestrator
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
