# payroll-sync Job (D-62 (3)): operator CLI run by IT, least privilege: this Job carries ONLY the secrets that
# cmd/sync reads (payroll_etl DSN, Oracle sync account, PII keys for the employee ETL). Template, not synced by ArgoCD: render per environment, then set the image tag and
# the arguments (subcommand + flags are in the CLI usage text), e.g.
#   kustomize build services/payroll-service/overlays/<env>/jobs | sed "s|IMAGE_TAG|<tag>|" \
#     | yq 'select(.metadata.name == "payroll-sync") | .spec.template.spec.containers[0].args = ["att","-dsn","$(PAYROLL_ETL_DSN)","-yymm","202701","-division","SOLO"]' | kubectl apply -f -
# Generated files (salary data!) go to /out (emptyDir): `kubectl cp` them out before the pod is deleted.
# Host and sslmode come from ConfigMap payroll-cli-config (generated per overlay, no secret in it).
apiVersion: batch/v1
kind: Job
metadata:
  name: payroll-sync
  labels:
    app: payroll-service
    component: cli
    app.kubernetes.io/name: payroll-service
    app.kubernetes.io/component: cli
    app.kubernetes.io/part-of: goapps
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600   # /out holds salary data: pod (and its emptyDir) is removed 1 h after finish; kubectl cp before then
  template:
    metadata:
      labels:
        app: payroll-service
        component: cli
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      restartPolicy: Never
      securityContext:
        fsGroup: 1000          # image user appuser (uid/gid 1000) must read the secret mount and write /out
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payroll-sync
          image: ghcr.io/mutugading/payroll-service:IMAGE_TAG
          imagePullPolicy: Always
          command: ["/app/payroll-sync"]
          env:
            - name: PAYROLL_PG_HOST
              valueFrom: {configMapKeyRef: {name: payroll-cli-config, key: PG_HOST}}
            - name: PAYROLL_PG_SSLMODE
              valueFrom: {configMapKeyRef: {name: payroll-cli-config, key: PG_SSLMODE}}
            - name: ETL_USER
              valueFrom: {secretKeyRef: {name: payroll-db-secret, key: ETL_USER}}
            - name: ETL_PASSWORD
              valueFrom: {secretKeyRef: {name: payroll-db-secret, key: ETL_PASSWORD}}
            - name: PAYROLL_ETL_DSN
              value: "host=$(PAYROLL_PG_HOST) port=5432 dbname=payroll user=$(ETL_USER) password=$(ETL_PASSWORD) sslmode=$(PAYROLL_PG_SSLMODE)"
            - name: PAYROLL_PII_KEY
              valueFrom: {secretKeyRef: {name: payroll-pii-secret, key: PAYROLL_PII_KEY}}
            - name: PAYROLL_PII_HMAC_KEY
              valueFrom: {secretKeyRef: {name: payroll-pii-secret, key: PAYROLL_PII_HMAC_KEY}}
            # Oracle HRIS sync (D-58): dedicated read-only account PAYROLL_SYNC_RO, NOT the shared oracle-credentials.
            - name: PAYROLL_SYNC_ORACLE_HOST
              valueFrom: {secretKeyRef: {name: payroll-oracle-sync-secret, key: PAYROLL_SYNC_ORACLE_HOST}}
            - name: PAYROLL_SYNC_ORACLE_PORT
              valueFrom: {secretKeyRef: {name: payroll-oracle-sync-secret, key: PAYROLL_SYNC_ORACLE_PORT}}
            - name: PAYROLL_SYNC_ORACLE_SERVICE
              valueFrom: {secretKeyRef: {name: payroll-oracle-sync-secret, key: PAYROLL_SYNC_ORACLE_SERVICE}}
            - name: PAYROLL_SYNC_ORACLE_USER
              valueFrom: {secretKeyRef: {name: payroll-oracle-sync-secret, key: PAYROLL_SYNC_ORACLE_USER}}
            - name: PAYROLL_SYNC_ORACLE_PASSWORD
              valueFrom: {secretKeyRef: {name: payroll-oracle-sync-secret, key: PAYROLL_SYNC_ORACLE_PASSWORD}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: out
              mountPath: /out
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: out
          emptyDir: {}
        - name: tmp
          emptyDir: {}
