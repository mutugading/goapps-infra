# payroll-report Job (D-62 (3)): operator CLI run by IT, least privilege: this Job carries ONLY the secrets that
# cmd/report reads (payroll_app DSN, PII key (slip), report layout config). Template, not synced by ArgoCD: render per environment, then set the image tag and
# the arguments (subcommand + flags are in the CLI usage text), e.g.
#   kustomize build services/payroll-service/overlays/<env>/jobs | sed "s|IMAGE_TAG|<tag>|" \
#     | yq 'select(.metadata.name == "payroll-report") | .spec.template.spec.containers[0].args = ["bank","-yymm","202701","-division","SOLO","-out","/out/bank.xlsx"]' | kubectl apply -f -
# Generated files (salary data!) go to /out (emptyDir): `kubectl cp` them out before the pod is deleted.
# Host and sslmode come from ConfigMap payroll-cli-config (generated per overlay, no secret in it).
apiVersion: batch/v1
kind: Job
metadata:
  name: payroll-report
  labels:
    app: payroll-service
    component: cli
    app.kubernetes.io/name: payroll-service
    app.kubernetes.io/component: cli
    app.kubernetes.io/part-of: goapps
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600   # /out holds salary data: pod (and its emptyDir) is removed 1 h after finish; kubectl cp before then
  template:
    metadata:
      labels:
        app: payroll-service
        component: cli
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      restartPolicy: Never
      securityContext:
        fsGroup: 1000          # image user appuser (uid/gid 1000) must read the secret mount and write /out
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payroll-report
          image: ghcr.io/mutugading/payroll-service:IMAGE_TAG
          imagePullPolicy: Always
          command: ["/app/payroll-report"]
          # Layout config (company, bank branch, escrow, signers, letterhead, transfer fee, slip texts): Secret payroll-report-config.
          envFrom:
            - secretRef:
                name: payroll-report-config
          env:
            - name: PAYROLL_PG_HOST
              valueFrom: {configMapKeyRef: {name: payroll-cli-config, key: PG_HOST}}
            - name: PAYROLL_PG_SSLMODE
              valueFrom: {configMapKeyRef: {name: payroll-cli-config, key: PG_SSLMODE}}
            - name: APP_USER
              valueFrom: {secretKeyRef: {name: payroll-db-secret, key: APP_USER}}
            - name: APP_PASSWORD
              valueFrom: {secretKeyRef: {name: payroll-db-secret, key: APP_PASSWORD}}
            - name: PAYROLL_APP_DSN
              value: "host=$(PAYROLL_PG_HOST) port=5432 dbname=payroll user=$(APP_USER) password=$(APP_PASSWORD) sslmode=$(PAYROLL_PG_SSLMODE)"
            - name: PAYROLL_PII_KEY
              valueFrom: {secretKeyRef: {name: payroll-pii-secret, key: PAYROLL_PII_KEY}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: out
              mountPath: /out
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: out
          emptyDir: {}
        - name: tmp
          emptyDir: {}
