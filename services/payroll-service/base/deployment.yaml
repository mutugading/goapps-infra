# Payroll Service Deployment (D-62 (8)). Only the API runs here; sync/report/mailer/recon are operator CLIs
# shipped in the same image and run through base/jobs/cli-job.yaml (D-62 (3)).
# The database is the dedicated `payroll` DB with the `payroll_app` role (RLS applies, NF1/NF8). The host and
# sslmode come from the overlay patch (patches/env-database.yaml). Only secret REFERENCES live in this repo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-service
  labels:
    app: payroll-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: payroll-service
  template:
    metadata:
      labels:
        app: payroll-service
        component: api      # lets NetworkPolicy tell the API from the CLI/migrate Job pods (selector stays app only)
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # image user appuser (uid/gid 1000)
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payroll-service
          image: ghcr.io/mutugading/payroll-service:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # the API writes nothing to disk; /tmp is an emptyDir just in case
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 50054
              name: grpc
            - containerPort: 8084
              name: http
          env:
            - name: APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PAYROLL_DATABASE_PORT
              value: "5432"
            - name: PAYROLL_DATABASE_NAME
              value: "payroll"
            - name: PAYROLL_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: payroll-db-secret
                  key: APP_USER
            - name: PAYROLL_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payroll-db-secret
                  key: APP_PASSWORD
            # Shared access-token secret with IAM (must be >= 32 bytes outside development).
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: goapps-auth-secret
                  key: JWT_ACCESS_SECRET
            # PII encryption/HMAC keys (D-17), >= 32 bytes each.
            - name: PAYROLL_PII_KEY
              valueFrom:
                secretKeyRef:
                  name: payroll-pii-secret
                  key: PAYROLL_PII_KEY
            - name: PAYROLL_PII_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: payroll-pii-secret
                  key: PAYROLL_PII_HMAC_KEY
            - name: CORS_ALLOWED_ORIGINS
              value: "https://app.goapps.local"
            - name: LOG_LEVEL
              value: "info"
            - name: TRACING_ENABLED
              value: "true"
            - name: JAEGER_ENDPOINT
              value: "jaeger-collector.observability.svc.cluster.local:4317"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /livez
              port: 8084
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8084
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
