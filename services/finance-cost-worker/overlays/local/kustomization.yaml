apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: goapps-local
resources:
- ../../base
patches:
# env-database first: keeps rendered env ordering (see staging note).
- path: patches/env-database.yaml
- path: patches/env-finance.yaml
- path: patches/resources.yaml
- path: patches/hpa.yaml
- path: patches/deployment-local.yaml
  target:
    kind: Deployment
    name: finance-cost-worker
- path: patches/servicemonitor-delete.yaml
images:
- name: ghcr.io/mutugading/finance-cost-worker
  newTag: local
