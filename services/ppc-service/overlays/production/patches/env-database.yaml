# Per-environment database endpoint for production.
# DB v2 cutover: traffic goes through pgbouncer-vps (in-cluster, no TLS on the
# pod->pgbouncer hop; pgbouncer->VPS 192.168.0.40 is TLS). Runtime services use the
# DML-only `ppc_app` role from Secret `ppc-db-secret` (keys APP_USER/APP_PASSWORD).
# Never put credentials in this file. See docs/db-v2-cutover.md.
#
# The env vars above the DATABASE block are restated verbatim from base/ ONLY to
# preserve the rendered env-list ordering (strategic merge appends unmatched
# entries). This patch is listed FIRST in kustomization.yaml for the same reason.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppc-service
spec:
  template:
    spec:
      containers:
        - name: ppc-service
          env:
            - name: APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PPC_DATABASE_HOST
              value: "pgbouncer-vps.database.svc.cluster.local"
            - name: PPC_DATABASE_PORT
              value: "5432"
            - name: PPC_DATABASE_NAME
              value: "ppc_db"
            - name: PPC_DATABASE_SSLMODE
              value: "disable"
            - name: PPC_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: ppc-db-secret
                  key: APP_USER
            - name: PPC_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ppc-db-secret
                  key: APP_PASSWORD
