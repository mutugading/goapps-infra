apiVersion: batch/v1
kind: Job
metadata:
  name: ppc-seed
spec:
  template:
    spec:
      containers:
        - name: ppc-seeder
          env:
            - name: PPC_DATABASE_HOST
              value: "192.168.0.40"
            - name: PPC_DATABASE_PORT
              value: "5432"
            - name: PPC_DATABASE_NAME
              value: "ppc_db"
            - name: PPC_DATABASE_SSLMODE
              value: "require"
            - name: PPC_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: ppc-db-secret
                  key: OWNER_USER
            - name: PPC_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ppc-db-secret
                  key: OWNER_PASSWORD
