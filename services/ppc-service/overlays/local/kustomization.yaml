apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: goapps-local
resources:
- ../../base
patches:
- path: patches/env-database.yaml   # first: preserves env ordering
- path: patches/env-cors.yaml
- path: patches/env-oracle.yaml
- path: patches/env-finance-client.yaml
- path: patches/deployment-local.yaml
- path: patches/ingress-local.yaml
- path: patches/hpa.yaml
- path: patches/servicemonitor-delete.yaml
- target:
    kind: Deployment
    name: ppc-service
  patch: |-
    - op: remove
      path: /spec/template/spec/imagePullSecrets
- target:
    kind: Ingress
    name: ppc-service
  patch: |-
    - op: remove
      path: /spec/tls
images:
- name: ghcr.io/mutugading/ppc-service
  newTag: local
