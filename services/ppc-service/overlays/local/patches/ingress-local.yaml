# Local (full rules incl. paths: Ingress rules is a list without merge key, so a host-only patch drops base paths): plain HTTP on api.goapps.localhost (tls removed in kustomization.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ppc-service
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: api.goapps.localhost
      http:
        paths:
          - path: /api/v1/ppc
            pathType: Prefix
            backend:
              service:
                name: ppc-service
                port:
                  number: 8082
