# Local: DB via pgbouncer-vps Service (-> host pgbouncer v2 :6440), ppc_app role from ppc-db-secret.
# Base env restated only to keep rendered env ordering.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppc-service
spec:
  template:
    spec:
      containers:
        - name: ppc-service
          env:
            - name: APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PPC_DATABASE_HOST
              value: "pgbouncer-vps.database.svc.cluster.local"
            - name: PPC_DATABASE_PORT
              value: "5432"
            - name: PPC_DATABASE_NAME
              value: "ppc_db"
            - name: PPC_DATABASE_SSLMODE
              value: "disable"
            - name: PPC_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: ppc-db-secret
                  key: APP_USER
            - name: PPC_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ppc-db-secret
                  key: APP_PASSWORD
