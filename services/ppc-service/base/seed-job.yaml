# PPC Seeder Job
# Seeds master reference data (overrun thresholds, downtime reasons, waste
# categories, machine groups) into ppc_db. Mirrors finance-service seed-job.
#
# The seeder binary is built by services/ppc/Dockerfile
# (`go build -o /bin/ppc-seed ./seeds/main.go`, copied to /app/ppc-seed).
#
# ORDER: run AFTER ppc-createdb and ppc-migrate.
#
# MANUAL USAGE:
#   kubectl delete job ppc-seed -n <namespace> --ignore-not-found
#   cat seed-job.yaml | sed "s|IMAGE_TAG|<tag>|" | kubectl apply -n <namespace> -f -
#   kubectl logs -f job/ppc-seed -n <namespace>
#
# NOTE: The seeder checks existence before insert, safe to run multiple times.
#
apiVersion: batch/v1
kind: Job
metadata:
  name: ppc-seed
  labels:
    app: ppc-service
    component: seeder
    app.kubernetes.io/name: ppc-service
    app.kubernetes.io/component: seeder
    app.kubernetes.io/part-of: goapps
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: ppc-service
        component: seeder
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      restartPolicy: Never
      containers:
        - name: ppc-seeder
          image: ghcr.io/mutugading/ppc-service:IMAGE_TAG
          imagePullPolicy: Always
          command: ["/app/ppc-seed"]
          env:
            - name: APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PPC_DATABASE_HOST
              # overridden per env (VPS IP) in overlays/*/jobs
              value: "set-in-overlay.invalid"
            - name: PPC_DATABASE_PORT
              value: "5432"
            - name: PPC_DATABASE_NAME
              value: "ppc_db"
            - name: PPC_DATABASE_SSLMODE
              value: "require"
            - name: PPC_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: ppc-db-secret
                  key: OWNER_USER
            - name: PPC_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ppc-db-secret
                  key: OWNER_PASSWORD
            # Service-to-service token. The seeder's machine-sync path calls
            # finance's internal RPCs, so it needs the same token the
            # Deployment uses (deployment.yaml feeds both env names from this
            # one secret key).
            - name: PPC_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ppc-internal-token
                  key: PPC_INTERNAL_TOKEN
            - name: PPC_JWT_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: ppc-internal-token
                  key: PPC_INTERNAL_TOKEN
            # Finance gRPC target. Without these the seeder's finance client
            # falls back to the localhost:50051 config default and the machine
            # sync silently degrades to a no-op.
            - name: FINANCE_GRPC_HOST
              value: "finance-service"
            - name: FINANCE_GRPC_PORT
              value: "50051"
            # Oracle — the machine sync derives machine_area from Oracle
            # TXTMACH, so a finance-only sync inserts nothing. Same
            # oracle-credentials secret keys the Deployment uses via the
            # overlays' env-oracle patch (this Job is not in kustomization.yaml,
            # so it cannot inherit that patch and must carry them inline).
            - name: ORACLE_HOST
              valueFrom:
                secretKeyRef:
                  name: oracle-credentials
                  key: ORACLE_HOST
            - name: ORACLE_PORT
              valueFrom:
                secretKeyRef:
                  name: oracle-credentials
                  key: ORACLE_PORT
            - name: ORACLE_SERVICE
              valueFrom:
                secretKeyRef:
                  name: oracle-credentials
                  key: ORACLE_SERVICE
            - name: ORACLE_USER
              valueFrom:
                secretKeyRef:
                  name: oracle-credentials
                  key: ORACLE_USER
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oracle-credentials
                  key: ORACLE_PASSWORD
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
