apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: goapps-local
resources:
- ../../base
patches:
- path: patches/replicas.yaml
- path: patches/resources.yaml
- path: patches/ingress-host.yaml
- path: patches/env-backend.yaml
- path: patches/hpa.yaml
# No ghcr-secret locally: image is loaded into the cluster directly.
- target:
    kind: Deployment
    name: frontend
  patch: |-
    - op: remove
      path: /spec/template/spec/imagePullSecrets
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
images:
- name: ghcr.io/mutugading/goapps-frontend
  newTag: local
