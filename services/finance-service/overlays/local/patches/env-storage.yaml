# Local: MinIO bucket, plain HTTP in-cluster, tracing off (no Jaeger locally).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-service
spec:
  template:
    spec:
      containers:
        - name: finance-service
          env:
            - name: MINIO_BUCKET
              value: "goapps-staging"
            - name: MINIO_USE_SSL
              value: "false"
            - name: MINIO_PUBLIC_URL
              value: "http://localhost:9000"
            - name: TRACING_ENABLED
              value: "false"
            - name: JAEGER_ENDPOINT
              value: ""
