# Local (full rules incl. paths: Ingress rules is a list without merge key, so a host-only patch drops base paths): plain HTTP, no TLS, host api.goapps.localhost
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance-service
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls: null
  rules:
    - host: api.goapps.localhost
      http:
        paths:
          - path: /api/v1/finance
            pathType: Prefix
            backend:
              service:
                name: finance-service
                port:
                  number: 8080
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: finance-service
                port:
                  number: 8080
