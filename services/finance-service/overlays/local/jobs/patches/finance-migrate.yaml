apiVersion: batch/v1
kind: Job
metadata:
  name: finance-migrate
spec:
  template:
    spec:
      imagePullSecrets: null  # no ghcr-secret locally
      containers:
        - name: finance-migrate
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: finance-db-secret
                  key: OWNER_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finance-db-secret
                  key: OWNER_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@postgres-v2.database.svc.cluster.local:5432/finance_db?sslmode=disable&x-migrations-table=schema_migrations_finance&options=-c%20lock_timeout%3D10s%20-c%20statement_timeout%3D0"
