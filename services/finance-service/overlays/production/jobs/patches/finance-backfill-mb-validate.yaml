apiVersion: batch/v1
kind: Job
metadata:
  name: finance-backfill-mb-validate
spec:
  template:
    spec:
      containers:
        - name: backfill-mb-validate
          env:
            - name: DATABASE_HOST
              value: "192.168.0.40"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: "finance_db"
            - name: DATABASE_SSLMODE
              value: "require"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: finance-db-secret
                  key: OWNER_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finance-db-secret
                  key: OWNER_PASSWORD
