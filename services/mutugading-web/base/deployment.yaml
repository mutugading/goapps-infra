apiVersion: apps/v1
kind: Deployment
metadata:
  name: mutugading-web
  labels:
    app: mutugading-web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0       # Never kill old pod before new one is ready
  selector:
    matchLabels:
      app: mutugading-web
  template:
    metadata:
      labels:
        app: mutugading-web
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: mutugading-web
          image: ghcr.io/mutugading/mutugading-web:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            # ponytail: rootfs stays writable — Next ISR persists regenerated pages into /app/.next/server
            # (an emptyDir there would hide the build output). Revisit with a custom cacheHandler (Redis).
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "750m"       # Next.js needs CPU limit >= 500m
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12    # 5 + (5*12) = 65s max startup time
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 3
