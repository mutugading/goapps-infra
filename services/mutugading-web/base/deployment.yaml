apiVersion: apps/v1
kind: Deployment
metadata:
  name: mutugading-web
  labels:
    app: mutugading-web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0       # Never kill old pod before new one is ready
  selector:
    matchLabels:
      app: mutugading-web
  template:
    metadata:
      labels:
        app: mutugading-web
    spec:
      automountServiceAccountToken: false   # public site, never talks to the k8s API
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: mutugading-web
          image: ghcr.io/mutugading/mutugading-web:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            # libvips (sharp, next/image) defaults to one thread per HOST core and ignores the CPU limit;
            # cap it so image encoding cannot starve the health probe.
            - name: VIPS_CONCURRENCY
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            # ponytail: rootfs stays writable — Next ISR persists regenerated pages into /app/.next/server
            # (an emptyDir there would hide the build output). Revisit with a custom cacheHandler (Redis).
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"     # sharp decodes full-size photos; 512Mi was OOMKilled on staging
              cpu: "750m"       # Next.js needs CPU limit >= 500m
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            timeoutSeconds: 5   # default 1s is too tight while sharp is encoding images
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12    # 5 + (5*12) = 65s max startup time
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            timeoutSeconds: 5   # default 1s is too tight while sharp is encoding images
            periodSeconds: 10
            failureThreshold: 6     # restart only after ~60s unresponsive
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            timeoutSeconds: 5   # default 1s is too tight while sharp is encoding images
            periodSeconds: 5
            failureThreshold: 3
