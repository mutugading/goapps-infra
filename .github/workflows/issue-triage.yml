name: Issue Triage

on:
  issues:
    types:
      - opened
      - reopened

permissions:
  contents: read
  issues: write
  projects: write

jobs:
  triage:
    name: Triage issue
    runs-on: ubuntu-latest

    steps:
      - name: Add issue to project and label it
        uses: actions/github-script@v7
        env:
          GOAPPS_PROJECT_OWNER: ${{ vars.GOAPPS_PROJECT_OWNER }}
          GOAPPS_PROJECT_NUMBER: ${{ vars.GOAPPS_PROJECT_NUMBER }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const labels = issue.labels.map((label) => label.name);
            const duplicateSearchTermLimit = 5;
            const duplicateMinimumTerms = 2;
            const duplicateResultLimit = 3;

            const statusLabels = new Set([
              'status:blocked',
              'status:needs-review',
              'status:triage',
            ]);

            if (!labels.some((label) => statusLabels.has(label))) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: ['status:triage'],
              });
            }

            const projectNumber = process.env.GOAPPS_PROJECT_NUMBER;
            if (!projectNumber) {
              core.info('GOAPPS_PROJECT_NUMBER is not configured; skipping project assignment.');
            } else {
              const projectOwner = process.env.GOAPPS_PROJECT_OWNER || owner;
              const projectData = await github.graphql(
                `
                query($login: String!, $number: Int!) {
                  repositoryOwner(login: $login) {
                    __typename
                    ... on Organization {
                      projectV2(number: $number) {
                        id
                      }
                    }
                    ... on User {
                      projectV2(number: $number) {
                        id
                      }
                    }
                  }
                }
                `,
                {
                  login: projectOwner,
                  number: Number(projectNumber),
                },
              );

              const projectId = projectData.repositoryOwner?.projectV2?.id;

              if (!projectId) {
                core.info(`Project ${projectOwner}/${projectNumber} was not found; skipping project assignment.`);
              } else {
                try {
                  await github.graphql(
                    `
                    mutation($projectId: ID!, $contentId: ID!) {
                      addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                        item {
                          id
                        }
                      }
                    }
                    `,
                    {
                      projectId,
                      contentId: issue.node_id,
                    },
                  );
                } catch (error) {
                  core.info(`Skipping project assignment: ${error.message}`);
                }
              }
            }

            const searchTerms = issue.title
              .replace(/[^\w\s-]/g, ' ')
              .split(/\s+/)
              .map((word) => word.trim())
              .filter((word) => word.length > 3)
              .slice(0, duplicateSearchTermLimit);

            const safeTerms = searchTerms
              .map((term) => term.replace(/[^A-Za-z0-9-]/g, ''))
              .filter((term) => term.length > 2);

            if (safeTerms.length < duplicateMinimumTerms) {
              return;
            }

            const query = [
              `repo:${owner}/${repo}`,
              'is:issue',
              'is:open',
              'in:title',
              ...safeTerms.map((term) => `"${term}"`),
            ].join(' ');

            const response = await github.rest.search.issuesAndPullRequests({
              q: query,
              per_page: 5,
              page: 1,
            });

            const duplicates = response.data.items
              .filter((item) => item.number !== issue.number)
              .slice(0, duplicateResultLimit);

            if (!duplicates.length) {
              return;
            }

            const duplicateBody = [
              'Possible duplicates found:',
              '',
              ...duplicates.map((duplicate) => `- #${duplicate.number} ${duplicate.title}`),
              '',
              'If one of these matches, please add the `duplicate` label manually.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: duplicateBody,
            });
