; Server-connection budget (staging, VPS max_connections=100):
;   per pgbouncer replica = sum(max_db_connections) = 39 (iam 8 + finance 22 + ppc 6 + payroll 3); x2 replicas = 78
;   + migrate/seed jobs (owner roles, limit 5 each; payroll_migrator 2) + backup_ro 4 + monitor 3 + admins
;   must stay < max_connections - superuser_reserved_connections. Re-check if replicas change.
;   Headroom: 100 - 3 (superuser_reserved) - 78 = 19 for jobs (migrate/seed 5 each, payroll_migrator 2) + backup_ro 4 +
;   monitor 3; was 25 before payroll. Thin if 3 migrate Jobs + backup overlap: raise VPS max_connections (staging) if so.
;   payroll CLI Jobs connect direct to the VPS, not through pgbouncer: payroll-sync (payroll_etl, limit 5), payroll-recon (payroll_ro, limit 5), payroll-report/payroll-mailer (payroll_app, shares its limit 40).
; PgBouncer config for the staging VPS PostgreSQL (192.168.0.60). Keep in sync with base template.
[databases]
iam_db = host=192.168.0.60 port=5432 dbname=iam_db pool_size=6 reserve_pool=2 max_db_connections=8
finance_db = host=192.168.0.60 port=5432 dbname=finance_db pool_size=20 reserve_pool=2 max_db_connections=22
ppc_db = host=192.168.0.60 port=5432 dbname=ppc_db pool_size=4 reserve_pool=2 max_db_connections=6
payroll = host=192.168.0.60 port=5432 dbname=payroll pool_size=2 reserve_pool=1 max_db_connections=3

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 20
min_pool_size = 5
; per-DB reserve_pool is set in [databases]; pgbouncer has no inline comments
reserve_pool_size = 0
max_prepared_statements = 200
server_tls_sslmode = require
client_tls_sslmode = disable
ignore_startup_parameters = extra_float_digits
server_reset_query = DISCARD ALL
log_connections = 1
log_disconnections = 1
stats_period = 60
admin_users = monitor
stats_users = monitor
